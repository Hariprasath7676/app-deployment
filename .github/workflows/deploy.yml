name: Deploy Next App

on:
  push:
    branches:
      - security-fixes

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build image
      run: docker build -t yourdockerid/lt-nilavan .

    - name: Push image
      run: docker push yourdockerid/lt-nilavan

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: hari
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull yourdockerid/lt-nilavan
          docker stop lt-nilavan || true
          docker rm lt-nilavan || true
          docker run -d --name lt-nilavan -p 3000:3000 yourdockerid/lt-nilavan
